<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>

  <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
</head>

<body>

<a-scene
  mindar-image="imageTargetSrc: 1.mind;"
  color-space="sRGB"
  embedded
  vr-mode-ui="enabled: false"
  device-orientation-permission-ui="enabled: false"
>

  <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

  <a-entity mindar-image-target="targetIndex: 0">

    <a-box color="red" depth="0.1" height="1" width="1"></a-box>

  </a-entity>

</a-scene>

<script>

document.querySelector("a-scene").addEventListener("arReady", () => {
  console.log("AR READY");
  alert("AR READY");
});

document.querySelector("a-scene").addEventListener("arError", (e) => {
  console.log("AR ERROR", e);
  alert("AR ERROR");
});

</script>

</body>
</html>
